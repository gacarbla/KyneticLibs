name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    verify:
        name: Node ${{ matrix.node }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: [20, 22, 24]

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Use Node.js ${{ matrix.node }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Reject tracked build artifacts
              run: |
                  if git ls-files -- '*.tsbuildinfo' 'packages/*/dist/*' | grep -q .; then
                      echo "::error::Build artifacts are tracked; remove them from git."
                      git ls-files -- '*.tsbuildinfo' 'packages/*/dist/*'
                      exit 1
                  fi

            - name: Build
              run: npm run build -- --force

            - name: Typecheck
              run: npm run typecheck

            - name: Test
              run: npm test

            - name: Lint
              run: npm run lint

            - name: Check formatting
              run: npm run format:check

            - name: Verify packaging
              run: npm run smoke
